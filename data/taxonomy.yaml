# Vocabulaire contrôlé d'Awesome AI.
#
# - categories : les 16 catégories de la liste source (champ `name` = nom anglais exact),
#   avec leur libellé français, leur couleur, leur synthèse et les fonctionnalités comparables.
# - features : dictionnaire des fonctionnalités. Une fonctionnalité est attribuée à un outil si
#   l'un de ses mots-clés apparaît (mot entier, sans casse) dans le nom, la description, les
#   topics GitHub ou, sauf `readme: false`, le début du README.
# - facets : caractéristiques transverses (déploiement, interfaces, matériel), cherchées dans
#   tout le README.
#
# La détection est automatique et peut se tromper : pour corriger un outil, ajouter une entrée
# dans data/overrides/ (voir data/overrides/README.md). Une valeur relue n'est jamais écrasée.

categories:
  - slug: agents-et-automatisation
    name: Agents and Automation
    label: Agents et automatisation
    color: "#6366f1"
    description: "Frameworks et plateformes pour construire des agents IA autonomes qui planifient, utilisent des outils, gardent une mémoire et enchaînent des tâches."
    goal: "Construire et exécuter des agents IA qui accomplissent des tâches en plusieurs étapes."
    problem: "Un LLM seul répond à une question ; il faut une couche d'orchestration pour lui donner des outils, une mémoire et un plan d'action fiable."
    features: [multi-agent, memory, tool-calling, workflows, visual-builder, browser-automation, sandbox, computer-use, human-in-the-loop, structured-output, tracing, mcp-support]

  - slug: interfaces-de-chat
    name: Chat Interfaces
    label: Interfaces de chat
    color: "#0ea5e9"
    description: "Applications web ou de bureau pour discuter avec des modèles locaux ou distants, souvent avec documents, plugins et gestion d'utilisateurs."
    goal: "Offrir une interface de conversation conviviale au-dessus de modèles locaux ou d'API."
    problem: "Les modèles auto-hébergés n'ont pas d'interface grand public ; ces outils apportent un équivalent de ChatGPT sous votre contrôle."
    features: [multi-provider, local-models, rag-docs, plugins, agents-support, multimodal, multi-user, personas, web-search, mcp-support]

  - slug: assistants-de-code
    name: Coding Assistants
    label: Assistants de code
    color: "#10b981"
    description: "Agents et extensions qui écrivent, modifient, expliquent ou relisent du code, dans le terminal, l'éditeur ou les pull requests."
    goal: "Aider les développeurs à écrire, comprendre et relire du code avec un LLM."
    problem: "Les assistants de code commerciaux envoient le code source dans le cloud ; ces outils fonctionnent avec des modèles locaux ou au choix."
    features: [terminal-agent, ide-extension, code-completion, autonomous-agent, code-review, codebase-index, git-integration, local-models, multi-provider, mcp-support]

  - slug: documents-et-ocr
    name: Document AI and OCR
    label: Documents et OCR
    color: "#f59e0b"
    description: "Outils qui extraient texte, tableaux, formules et structure de PDF, images ou scans pour les rendre exploitables par des LLM."
    goal: "Transformer des documents (PDF, scans, images) en texte structuré exploitable."
    problem: "Les documents réels mêlent mise en page, tableaux et images ; il faut les convertir proprement avant toute recherche ou RAG."
    features: [ocr, pdf-conversion, layout, tables, formulas, markdown-output, vlm, multilingual, handwriting, batch]

  - slug: fine-tuning-et-entrainement
    name: Fine-Tuning and Training
    label: Fine-tuning et entraînement
    color: "#ef4444"
    description: "Bibliothèques et interfaces pour adapter un modèle à vos données (LoRA, entraînement complet, alignement) sur votre propre matériel."
    goal: "Adapter ou entraîner des modèles sur vos propres données et votre matériel."
    problem: "Les modèles génériques ne connaissent pas votre domaine ; le fine-tuning les spécialise sans dépendre d'un service externe."
    features: [lora, full-finetune, rlhf, quantization, distributed, memory-efficient, dataset-tools, multimodal, evals]

  - slug: ia-personnelle-et-maison
    name: Home and Personal AI
    label: IA personnelle et maison
    color: "#84cc16"
    description: "Assistants et applications du quotidien qui gardent vos données chez vous : domotique, photos, notes, voix, e-mails."
    goal: "Apporter l'IA aux usages personnels et domestiques sans envoyer vos données dans le cloud."
    problem: "Les assistants grand public exploitent vos données privées ; ces outils offrent les mêmes services en local."
    features: [home-automation, voice-assistant, personal-knowledge, photos, email-calendar, documents-archive, memory, privacy, mobile]

  - slug: generation-image-et-video
    name: Image and Video Generation
    label: Génération d'images et de vidéos
    color: "#ec4899"
    description: "Interfaces et modèles de génération d'images et de vidéos (diffusion) à faire tourner sur vos propres GPU."
    goal: "Générer et retoucher des images ou des vidéos à partir de texte ou d'images sur votre GPU."
    problem: "Les générateurs en ligne sont payants, filtrés et gardent vos créations ; l'auto-hébergement rend le contrôle et la confidentialité."
    features: [text-to-image, text-to-video, node-workflow, inpainting, controlnet, upscaling, lora-support, low-vram, plugins]

  - slug: runtimes-llm-et-inference
    name: LLM Runtimes and Inference
    label: Runtimes LLM et inférence
    color: "#8b5cf6"
    description: "Moteurs qui chargent et servent des modèles de langage sur CPU ou GPU, du portable au cluster, souvent avec une API compatible OpenAI."
    goal: "Exécuter et servir des modèles de langage localement ou sur vos serveurs."
    problem: "Faire tourner un LLM efficacement demande quantification, gestion mémoire et API standard ; ces runtimes s'en chargent."
    features: [quantization, gguf, multi-gpu, batching, kv-cache, speculative, streaming, model-hub, multimodal, structured-output, tool-calling, edge]

  - slug: serveurs-et-passerelles-mcp
    name: MCP Servers and Gateways
    label: Serveurs et passerelles MCP
    color: "#14b8a6"
    description: "Serveurs Model Context Protocol qui exposent des outils et des données aux agents, et passerelles qui les regroupent et les sécurisent."
    goal: "Connecter les agents et assistants IA à des outils et des données via le protocole MCP."
    problem: "Chaque assistant intègre les outils à sa façon ; MCP standardise l'accès et les passerelles centralisent sécurité et découverte."
    features: [mcp-server, mcp-gateway, auth, transport, policy, browser-automation, database, filesystem, web-search, tracing]

  - slug: passerelles-et-routeurs-de-modeles
    name: Model Gateways and Routers
    label: Passerelles et routeurs de modèles
    color: "#f97316"
    description: "Proxys qui placent une API unique devant plusieurs fournisseurs ou modèles, avec routage, quotas, cache et suivi des coûts."
    goal: "Accéder à de nombreux modèles et fournisseurs derrière une seule API maîtrisée."
    problem: "Multiplier les fournisseurs complique clés, coûts et pannes ; une passerelle unifie l'accès et ajoute bascule et contrôle."
    features: [multi-provider, load-balancing, failover, caching, rate-limiting, cost-tracking, key-management, guardrails, tracing]

  - slug: observabilite-et-evaluation
    name: Observability and Evals
    label: Observabilité et évaluation
    color: "#64748b"
    description: "Plateformes de traces, d'évaluation, de gestion de prompts et de surveillance pour les applications LLM en production."
    goal: "Mesurer, tracer et évaluer la qualité des applications LLM."
    problem: "Les réponses d'un LLM sont non déterministes ; sans traces ni évaluations, impossible de savoir si une application s'améliore ou régresse."
    features: [tracing, evals, prompt-management, dataset-tools, cost-tracking, dashboards, opentelemetry, guardrails, red-teaming, gpu-monitoring]

  - slug: rag-et-bases-vectorielles
    name: RAG and Vector Databases
    label: RAG et bases vectorielles
    color: "#3b82f6"
    description: "Bases vectorielles et frameworks de génération augmentée par la recherche (RAG) pour répondre à partir de vos propres documents."
    goal: "Permettre à un LLM de répondre à partir de vos documents grâce à la recherche vectorielle."
    problem: "Un LLM ignore vos données internes et invente quand il ne sait pas ; le RAG retrouve les bons passages et cite ses sources."
    features: [vector-search, hybrid-search, ingestion, graph-rag, reranking, filtering, multi-tenancy, scalability, citations, visual-builder]

  - slug: recherche-et-connaissances
    name: Search and Knowledge
    label: Recherche et connaissances
    color: "#a855f7"
    description: "Moteurs de recherche IA, outils de recherche approfondie et bases de connaissances qui indexent le web ou vos fichiers."
    goal: "Retrouver et synthétiser l'information, sur le web ou dans vos propres fichiers."
    problem: "La recherche par mots-clés trouve des pages, pas des réponses ; ces outils combinent recherche et synthèse en gardant les données chez vous."
    features: [web-search, answer-engine, deep-research, semantic-search, local-index, knowledge-base, connectors, ocr, citations]

  - slug: parole-et-audio
    name: Speech and Audio
    label: Parole et audio
    color: "#e11d48"
    description: "Transcription (speech-to-text), synthèse vocale (text-to-speech), clonage de voix et génération audio en local."
    goal: "Transcrire, synthétiser ou transformer la voix et l'audio sur votre machine."
    problem: "Les services vocaux du cloud facturent à la minute et écoutent vos enregistrements ; ces modèles tournent hors ligne."
    features: [stt, tts, voice-cloning, realtime, diarization, multilingual, emotion, translation, music]

  - slug: vision-et-multimodal
    name: Vision and Multimodal
    label: Vision et multimodal
    color: "#06b6d4"
    description: "Modèles et outils qui comprennent les images et la vidéo : détection, description, questions visuelles."
    goal: "Analyser et comprendre images et vidéos avec des modèles locaux."
    problem: "Interpréter le contenu visuel demandait des API propriétaires ; ces modèles le font sur votre matériel."
    features: [object-detection, vlm, image-understanding, video-analysis, ocr, face, edge]

  - slug: agents-vocaux
    name: Voice Agents
    label: Agents vocaux
    color: "#d946ef"
    description: "Frameworks pour construire des assistants vocaux temps réel qui écoutent, réfléchissent et répondent, y compris au téléphone."
    goal: "Construire des agents conversationnels qui parlent et écoutent en temps réel."
    problem: "Enchaîner reconnaissance vocale, LLM et synthèse avec une latence faible et la gestion des interruptions est difficile ; ces frameworks l'orchestrent."
    features: [realtime, stt, tts, turn-detection, telephony, webrtc, memory, avatars, multimodal]

